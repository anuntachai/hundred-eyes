# Hundred Eyes — local dev deployment
# ใช้: docker compose --env-file .env.docker up -d --build
services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* ต้องมีตอน build (inline เข้า client bundle)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://dummy.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-dummy-anon}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-BM-dummy}
    env_file: .env.docker
    environment:
      # runtime override สำหรับ server-side (API route ใช้ service role) —
      # ใน container "localhost" ไม่ใช่เครื่อง host จึงต้องใช้ host.docker.internal
      NEXT_PUBLIC_SUPABASE_URL: ${SERVER_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
